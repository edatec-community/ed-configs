# Managed by ed-config: keep the WM8960 hardware mixer authoritative.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
        api.alsa.card.name = "wm8960-soundcard"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = false
        device.profile-set = "ed-wm8960.conf"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        alsa.card_name = "wm8960-soundcard"
      }
    ]
    actions = {
      update-props = {
        priority.session = 1200
        api.alsa.soft-mixer = false
        audio.format = "S16LE"
      }
    }
  }
]
