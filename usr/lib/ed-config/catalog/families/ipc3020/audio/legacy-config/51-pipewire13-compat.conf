# Managed by ed-config: Debian 13 compatibility for the 3020 audio package.
monitor.alsa.rules = [
  {
    matches = [
      {
        api.alsa.card.name = "~vc4-hdmi-.*"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
  {
    matches = [
      {
        device.name = "~alsa_card.*"
        api.alsa.card.name = "rt5616-codec"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = false
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        alsa.card_name = "rt5616-codec"
      }
    ]
    actions = {
      update-props = {
        priority.session = 3000
        api.alsa.soft-mixer = false
        audio.format = "S16LE"
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_input.*"
        alsa.card_name = "rt5616-codec"
      }
    ]
    actions = {
      update-props = {
        priority.session = 3000
      }
    }
  }
]
