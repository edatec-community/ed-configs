# Debian 13 compatibility for the legacy 3020 audio package.
monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "~alsa_card.*"
        api.alsa.card.name = "rt5616-codec"
      }
    ]
    actions = {
      update-props = {
        api.alsa.soft-mixer = false
      }
    }
  }
  {
    matches = [
      {
        node.name = "~alsa_output.*"
        alsa.card_name = "rt5616-codec"
      }
    ]
    actions = {
      update-props = {
          priority.session = 1200
          api.alsa.soft-mixer = false
          audio.format = "S16LE"
      }
    }
  }
]
