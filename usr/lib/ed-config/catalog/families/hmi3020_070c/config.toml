format = "ed-config-family"
version = 1
id = "hmi3020_070c"
platform = "PI5"
wireplumber_audio_format = "S16LE"
wireplumber_modern_file = "audio/legacy-config/51-pipewire13-compat.conf"
alsa_config_file = "audio/legacy-config/asound.conf"
alsa_state_file = "audio/legacy-config/asound.state"
alsa_state_blocks = ["rt5616codec"]
audio_packages = [
  "packages/audio/libasound2-plugins_1.2.12-2+b1_arm64.deb",
  "packages/audio/libpulsedsp_17.0+dfsg1-2+rpt1_arm64.deb",
  "packages/audio/pulseaudio-utils_17.0+dfsg1-2+rpt1_arm64.deb",
  "packages/audio/pulseaudio_17.0+dfsg1-2+rpt1_arm64.deb",
]

config_lines = [
  "dtoverlay=vc4-kms-dsi-edatec-panel-070c,interrupt=17",
  "dtoverlay=uart2-pi5",
  "dtoverlay=uart4-pi5",
  "dtparam=pcie=on",
  "dtparam=pciex1=on",
  "dtoverlay=rt5616",
  "dtoverlay=act-led,gpio=16",
  "gpio=6=op,dl",
]

[[udev_rules]]
path = "/etc/udev/rules.d/98-com.rules"
content_file = "98-com.rules"

[[udev_rules]]
path = "/etc/udev/rules.d/backlight-permissions.rules"
content_file = "backlight-permissions.rules"
