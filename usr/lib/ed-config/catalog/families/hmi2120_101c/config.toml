format = "ed-config-family"
version = 1
id = "hmi2120_101c"
platform = "CM4"
disable_config_on_ubuntu = true
desktop_config = "h101c"

config_lines = [
  "dtparam=i2c_arm=on",
  "dtoverlay=vc4-kms-dsi-edatec-panel-101c,interrupt=7",
  "dtoverlay=ed-ipc,ipc2100",
  "dtoverlay=uart2",
  "dtoverlay=uart3",
  "dtoverlay=uart4",
  "dtoverlay=uart5",
  "dtoverlay=i2c-rtc,pcf8563,i2c_csi_dsi",
  "dtoverlay=sdhost,gpios_22_27,preserve_mmc",
  "enable_uart=1",
]

[[udev_rules]]
path = "/etc/udev/rules.d/98-com.rules"
content_file = "98-com.rules"
