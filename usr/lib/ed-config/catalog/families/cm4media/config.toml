format = "ed-config-family"
version = 1
id = "cm4media"
platform = "CM4"
wireplumber_modern_file = "audio/wm8960/51-ed-config-wm8960.conf"
wireplumber_modern_target = "/etc/wireplumber/wireplumber.conf.d/51-ed-config-rt5616.conf"
alsa_profile_set_file = "audio/wm8960/ed-wm8960.conf"
alsa_profile_set_target = "/etc/alsa-card-profile/mixer/profile-sets/ed-wm8960.conf"
alsa_profile_path_files = ["audio/wm8960/ed-wm8960-output-speaker.conf"]
alsa_profile_path_targets = ["/etc/alsa-card-profile/mixer/paths/ed-wm8960-output-speaker.conf"]
alsa_config_file = "audio/wm8960/asound.conf"
alsa_config_target = "/etc/asound.conf"
alsa_state_file = "audio/wm8960/asound.state"
alsa_state_target = "/var/lib/alsa/asound.state"
alsa_state_blocks = ["wm8960soundcard"]

config_lines = [
  "dtparam=i2c_arm=on",
  "gpio=15=op,dh",
  "dtoverlay=wm8960-soundcard,media",
  "dtoverlay=i2c-rtc,pcf8563,i2c_csi_dsi",
]
