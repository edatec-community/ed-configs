# Managed by ed-config: WM8960 ACP profile without the generic speaker-path
# operation that mutes the independent headphone volume control.
[General]
auto-profiles = yes

[Mapping stereo-fallback]
device-strings = hw:%f
fallback = yes
channel-map = front-left,front-right
paths-output = ed-wm8960-output-speaker analog-output-headphones
paths-input = analog-input
priority = 1
