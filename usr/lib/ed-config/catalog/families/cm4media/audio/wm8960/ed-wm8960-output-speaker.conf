# Managed by ed-config: do not mute the independent WM8960 headphone control
# when the speaker route is selected.
[General]
priority = 100
description-key = analog-output-speaker

[Properties]
device.icon_name = audio-speakers

[Element Speaker]
required-any = any
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

.include analog-output.conf.common
