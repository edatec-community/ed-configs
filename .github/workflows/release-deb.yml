name: Validate release tag

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Debian packaging tools
        run: sudo apt-get update && sudo apt-get install --yes build-essential debhelper device-tree-compiler

      - name: Validate Catalog and overlay sources
        run: PYTHONDONTWRITEBYTECODE=1 ./ed-config _validate -j

      - name: Check tag and package versions
        shell: bash
        run: |
          set -eu
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$tag_version" = "$GITHUB_REF_NAME" ]; then
            echo "Release tags must start with v (for example v1.0.0)." >&2
            exit 1
          fi
          package_version="$(dpkg-parsechangelog --show-field Version)"
          app_version="$(PYTHONDONTWRITEBYTECODE=1 python3 -c 'import sys; sys.path.insert(0, "usr/lib/ed-config"); from edconfig import __version__; print(__version__)')"
          if [ "$tag_version" != "$package_version" ] || [ "$tag_version" != "$app_version" ]; then
            echo "Tag $GITHUB_REF_NAME must match Debian version $package_version and application version $app_version." >&2
            exit 1
          fi
